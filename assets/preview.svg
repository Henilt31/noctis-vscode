    <g font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#5F6878" text-anchor="end">
      <text x="295" y="132">1</text>
      <text x="295" y="154">2</text>
      <text x="295" y="176">3</text>
      <text x="295" y="198">4</text>
      <text x="295" y="220">5</text>
      <text x="295" y="242">6</text>
      <text x="295" y="264">7</text>
