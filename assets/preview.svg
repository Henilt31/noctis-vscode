      <text x="280" y="590" fill="#8B93A3">[11:42:15] Executing pre-publish validation checks...</text>
      <text x="280" y="612" fill="#4ADE80">✔ Verified 4 themes (Noctis, Crimson, Violet, Midnight OLED)</text>
