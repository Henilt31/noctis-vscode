<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <rect width="600" height="360" rx="12" fill="#030406" stroke="#1A1F2B" stroke-width="2" />
  <g transform="translate(30, 30)">
    <circle cx="16" cy="16" r="16" fill="#708DF5" />
    <text x="44" y="22" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#E6EBF2">Noctis Midnight (OLED)</text>
    <text x="0" y="65" font-family="-apple-system, sans-serif" font-size="14" fill="#828B9B">True-dark OLED obsidian canvas with electric starlight blue accents.</text>

    <rect y="90" width="540" height="180" rx="8" fill="#050608" stroke="#121620" stroke-width="1" />
    <g transform="translate(20, 115)" font-family="monospace" font-size="13">
      <text y="0"><tspan fill="#B894FF">const </tspan><tspan fill="#E6EBF2">midnightConfig </tspan><tspan fill="#79C0FF">= </tspan><tspan fill="#79C0FF">{</tspan></text>
      <text y="24"><tspan fill="#E6EBF2">  variant</tspan><tspan fill="#79C0FF">: </tspan><tspan fill="#7EE787">'midnight'</tspan><tspan fill="#79C0FF">,</tspan></text>
      <text y="48"><tspan fill="#E6EBF2">  accentHex</tspan><tspan fill="#79C0FF">: </tspan><tspan fill="#FF959D">'#708DF5'</tspan><tspan fill="#79C0FF">,</tspan></text>
      <text y="72"><tspan fill="#E6EBF2">  oledOptimized</tspan><tspan fill="#79C0FF">: </tspan><tspan fill="#FF959D">true</tspan><tspan fill="#79C0FF">,</tspan></text>
      <text y="96"><tspan fill="#70A6FF">  launchSession</tspan><tspan fill="#79C0FF">() { </tspan><tspan fill="#B894FF">return </tspan><tspan fill="#FF959D">true</tspan><tspan fill="#79C0FF">; }</tspan></text>
      <text y="120"><tspan fill="#79C0FF">};</tspan></text>
    </g>
  </g>
</svg>
