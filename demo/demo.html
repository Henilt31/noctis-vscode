<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Noctis Theme - Engineered for Deep Work">
  <title>Noctis Workspace Preview</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body class="theme-noctis">
  <main id="app-root" class="container">
    <header class="navbar">
      <div class="brand">
        <svg class="logo" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#8B7CFF" stroke-width="2"/>
          <path d="M7 17L12 7L17 17" stroke="#5CC8FF" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="brand-title">NOCTIS</span>
      </div>
      <nav class="nav-links">
        <a href="#overview" class="link is-active">Overview</a>
        <a href="#variants" class="link">Variants</a>
        <a href="#docs" class="link">Documentation</a>
      </nav>
    </header>

    <section class="hero-section">
      <h1 class="headline">Darkness, clarity, and code.</h1>
      <p class="subtitle">A dark VS Code theme engineered for deep work.</p>
      <div class="action-group">
        <button type="button" class="btn btn-primary" data-action="install">Install Noctis</button>
        <a href="https://github.com/Henilt31/noctis-vscode" class="btn btn-secondary" target="_blank" rel="noopener">GitHub</a>
      </div>
    </section>
  </main>
</body>
</html>
