      <!-- Line 1: Comment -->
      <text x="315" y="132" fill="#596273" font-style="italic">/** Noctis Theme - Deep Work Engine */</text>

      <!-- Line 2: Empty -->

      <!-- Line 3: Interface -->
      <text x="315" y="176">
        <tspan fill="#C792EA">export </tspan>
        <tspan fill="#C792EA">interface </tspan>
        <tspan fill="#89DDFF">SessionConfig </tspan>
        <tspan fill="#89DDFF">{</tspan>
      </text>

      <!-- Line 4: Property -->
      <text x="335" y="198">
        <tspan fill="#C792EA">readonly </tspan>
        <tspan fill="#E6E9EF">sessionId</tspan>
        <tspan fill="#89DDFF">: </tspan>
        <tspan fill="#89DDFF">string</tspan>
        <tspan fill="#89DDFF">;</tspan>
      </text>

      <!-- Line 5: Property -->
      <text x="335" y="220">
        <tspan fill="#E6E9EF">maxRetries</tspan>
        <tspan fill="#89DDFF">: </tspan>
        <tspan fill="#89DDFF">number</tspan>
        <tspan fill="#89DDFF">;</tspan>
      </text>

      <!-- Line 6: Property with string union -->
      <text x="335" y="242">
        <tspan fill="#E6E9EF">environment</tspan>
        <tspan fill="#89DDFF">: </tspan>
        <tspan fill="#A6E3A1">'development' </tspan>
        <tspan fill="#89DDFF">| </tspan>
        <tspan fill="#A6E3A1">'production'</tspan>
        <tspan fill="#89DDFF">;</tspan>
      </text>

      <!-- Line 7: Closing brace -->
      <text x="315" y="264" fill="#89DDFF">}</text>

      <!-- Line 8: Empty -->

      <!-- Line 9: Function declaration -->
      <text x="315" y="308">
        <tspan fill="#C792EA">export </tspan>
        <tspan fill="#C792EA">async </tspan>
        <tspan fill="#C792EA">function </tspan>
        <tspan fill="#82AAFF">executeDeepWork</tspan>
        <tspan fill="#89DDFF">&lt;</tspan><tspan fill="#89DDFF">T</tspan><tspan fill="#89DDFF">&gt;</tspan>
        <tspan fill="#89DDFF">(</tspan>
        <tspan fill="#E6E9EF">config</tspan>
        <tspan fill="#89DDFF">: </tspan>
        <tspan fill="#89DDFF">SessionConfig</tspan>
        <tspan fill="#89DDFF">): </tspan>
        <tspan fill="#89DDFF">Promise</tspan>
        <tspan fill="#89DDFF">&lt;</tspan><tspan fill="#89DDFF">T</tspan><tspan fill="#89DDFF">&gt; </tspan>
        <tspan fill="#89DDFF">{</tspan>
      </text>

      <!-- Line 10: Constant -->
      <text x="335" y="330">
        <tspan fill="#C792EA">const </tspan>
        <tspan fill="#E6E9EF">startTime </tspan>
        <tspan fill="#89DDFF">= </tspan>
        <tspan fill="#82AAFF">Date</tspan><tspan fill="#89DDFF">.</tspan><tspan fill="#82AAFF">now</tspan><tspan fill="#89DDFF">();</tspan>
      </text>

      <!-- Line 11: Try statement -->
      <text x="335" y="352">
        <tspan fill="#C792EA">try </tspan>
        <tspan fill="#89DDFF">{</tspan>
      </text>

      <!-- Line 12: Active line with cursor -->
      <text x="355" y="372">
        <tspan fill="#82AAFF">console</tspan><tspan fill="#89DDFF">.</tspan><tspan fill="#82AAFF">log</tspan><tspan fill="#89DDFF">(</tspan><tspan fill="#A6E3A1">`[Noctis] Initialized session: ${</tspan><tspan fill="#E6E9EF">config</tspan><tspan fill="#89DDFF">.</tspan><tspan fill="#E6E9EF">sessionId</tspan><tspan fill="#A6E3A1">}`</tspan><tspan fill="#89DDFF">);</tspan>
      </text>
      <!-- Cursor -->
      <rect x="795" y="359" width="2" height="15" fill="#8B7CFF" />

      <!-- Line 13: Return -->
      <text x="355" y="394">
        <tspan fill="#C792EA">return </tspan>
        <tspan fill="#C792EA">await </tspan>
        <tspan fill="#82AAFF">dispatchAsyncTasks</tspan><tspan fill="#89DDFF">(</tspan><tspan fill="#E6E9EF">config</tspan><tspan fill="#89DDFF">);</tspan>
      </text>

      <!-- Line 14: Catch -->
      <text x="335" y="416">
        <tspan fill="#89DDFF">} </tspan>
        <tspan fill="#C792EA">catch </tspan>
        <tspan fill="#89DDFF">(</tspan><tspan fill="#E6E9EF">err</tspan><tspan fill="#89DDFF">) {</tspan>
      </text>

      <!-- Line 15: Error log -->
      <text x="355" y="438">
        <tspan fill="#82AAFF">console</tspan><tspan fill="#89DDFF">.</tspan><tspan fill="#82AAFF">error</tspan><tspan fill="#89DDFF">(</tspan><tspan fill="#FF6B7A">'Deep work task failed'</tspan><tspan fill="#89DDFF">, </tspan><tspan fill="#E6E9EF">err</tspan><tspan fill="#89DDFF">);</tspan>
      </text>

      <!-- Line 16: Closing brace -->
      <text x="335" y="460" fill="#89DDFF">}</text>

      <!-- Line 17: Closing brace -->
      <text x="315" y="482" fill="#89DDFF">}</text>
