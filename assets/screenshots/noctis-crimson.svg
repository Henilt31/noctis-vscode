<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <rect width="600" height="360" rx="12" fill="#0D080A" stroke="#2E1E26" stroke-width="2" />
  <g transform="translate(30, 30)">
    <circle cx="16" cy="16" r="16" fill="#FF5C77" />
    <text x="44" y="22" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#EBE6E8">Noctis Crimson</text>
    <text x="0" y="65" font-family="-apple-system, sans-serif" font-size="14" fill="#9C8F94">Warm obsidian depth with restrained crimson &amp; rosewood accents.</text>

    <rect y="90" width="540" height="180" rx="8" fill="#110B0E" stroke="#23171D" stroke-width="1" />
    <g transform="translate(20, 115)" font-family="monospace" font-size="13">
      <text y="0"><tspan fill="#F472B6">const </tspan><tspan fill="#EBE6E8">crimsonConfig </tspan><tspan fill="#FCA5A5">= </tspan><tspan fill="#FCA5A5">{</tspan></text>
      <text y="24"><tspan fill="#EBE6E8">  variant</tspan><tspan fill="#FCA5A5">: </tspan><tspan fill="#A7F3D0">'crimson'</tspan><tspan fill="#FCA5A5">,</tspan></text>
      <text y="48"><tspan fill="#EBE6E8">  accentHex</tspan><tspan fill="#FCA5A5">: </tspan><tspan fill="#FDA4AF">'#FF5C77'</tspan><tspan fill="#FCA5A5">,</tspan></text>
      <text y="72"><tspan fill="#EBE6E8">  warmthIndex</tspan><tspan fill="#FCA5A5">: </tspan><tspan fill="#FBBF24">0.85</tspan><tspan fill="#FCA5A5">,</tspan></text>
      <text y="96"><tspan fill="#FB7185">  launchSession</tspan><tspan fill="#FCA5A5">() { </tspan><tspan fill="#F472B6">return </tspan><tspan fill="#FDA4AF">true</tspan><tspan fill="#FCA5A5">; }</tspan></text>
      <text y="120"><tspan fill="#FCA5A5">};</tspan></text>
    </g>
  </g>
</svg>
