<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <rect width="600" height="360" rx="12" fill="#090810" stroke="#2A2242" stroke-width="2" />
  <g transform="translate(30, 30)">
    <circle cx="16" cy="16" r="16" fill="#A855F7" />
    <text x="44" y="22" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#ECE8F5">Noctis Violet</text>
    <text x="0" y="65" font-family="-apple-system, sans-serif" font-size="14" fill="#9890AD">Cosmic amethyst depth with luminous violet &amp; indigo highlights.</text>

    <rect y="90" width="540" height="180" rx="8" fill="#0D0B16" stroke="#1F1932" stroke-width="1" />
    <g transform="translate(20, 115)" font-family="monospace" font-size="13">
      <text y="0"><tspan fill="#C084FC">const </tspan><tspan fill="#ECE8F5">violetConfig </tspan><tspan fill="#A5B4FC">= </tspan><tspan fill="#A5B4FC">{</tspan></text>
      <text y="24"><tspan fill="#ECE8F5">  variant</tspan><tspan fill="#A5B4FC">: </tspan><tspan fill="#86EFAC">'violet'</tspan><tspan fill="#A5B4FC">,</tspan></text>
      <text y="48"><tspan fill="#ECE8F5">  accentHex</tspan><tspan fill="#A5B4FC">: </tspan><tspan fill="#F472B6">'#A855F7'</tspan><tspan fill="#A5B4FC">,</tspan></text>
      <text y="72"><tspan fill="#ECE8F5">  frequency</tspan><tspan fill="#A5B4FC">: </tspan><tspan fill="#FDE047">432</tspan><tspan fill="#A5B4FC">,</tspan></text>
      <text y="96"><tspan fill="#A78BFA">  launchSession</tspan><tspan fill="#A5B4FC">() { </tspan><tspan fill="#C084FC">return </tspan><tspan fill="#F472B6">true</tspan><tspan fill="#A5B4FC">; }</tspan></text>
